[package]
name = "engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85" # rand 0.10 and mailparse 0.18 need it
license = "MIT"

[dependencies]
anyhow = "1"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.18"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] } # a time written to a backup reads back as the same time
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
open = "5"   # opens a provider's page in the person's own browser (see webpage.rs)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
rand = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
