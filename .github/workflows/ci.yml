name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Every action is pinned to a full commit SHA (the comment names the release). Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            engine
            app/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: UI scripts parse
        shell: bash
        run: for f in app/ui/*.js; do node --check "$f"; done
      - name: Versions agree across the project
        shell: bash
        run: python3 scripts/bump_version.py --check
      - name: The release check itself works
        shell: bash
        run: python3 scripts/test_bump_version.py
      - name: Test catalogue is up to date
        shell: bash
        run: |
          python3 scripts/gen_testcases.py
          git diff --exit-code docs/TESTCASES.md || { echo "docs/TESTCASES.md is stale: run python scripts/gen_testcases.py and commit"; exit 1; }
      - name: Documentation checks (links, diagrams, the command reference, ADRs, doc comments)
        shell: bash
        run: |
          python3 scripts/test_check_docs.py
          python3 scripts/check_docs.py
      - name: Format
        working-directory: engine
        run: cargo fmt --check
      - name: Lint (warnings are errors)
        working-directory: engine
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust documentation builds (warnings are errors)
        working-directory: engine
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Engine tests (unit, security, edge cases, mock IMAP server, phone hub)
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/engine-tests.log"
      - name: Say which engine tests failed (a job log needs a sign-in to read; an annotation does not)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/engine-tests.log"
          [ -f "$f" ] || exit 0
          msg=$( { grep -E -A4 "panicked at|^test .* FAILED$|^---- .* stdout ----$" "$f" | head -60; echo "--- the last lines ---"; tail -20 "$f"; } | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          echo "::error title=Engine tests failed::$msg"
      - name: The window's own tests (the real window in a real browser)
        # Needs no install: Node's own test runner and the browser the runner already has. A missing browser is a failure here.
        # After the engine's tests, and run even when they failed, so that one problem does not hide the other.
        if: success() || failure()
        shell: bash
        env:
          INBOX_AGENT_UI_TESTS: require
        run: |
          set -o pipefail
          cd app && npm test 2>&1 | tee "$RUNNER_TEMP/window-tests.log"
      - name: Say which window tests failed
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/window-tests.log"
          [ -f "$f" ] || exit 0
          # The failures the runner names, and always the last lines too: a test that timed out or a browser that never
          # started names nothing the first part would find.
          msg=$( { grep -E -A6 "^\s*✖|AssertionError|Error:|^not ok" "$f" | head -60; echo "--- the last lines ---"; tail -30 "$f"; } | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          echo "::error title=Window tests failed::$msg"

  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Dependency vulnerability scan (Rust)
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: "Dependency vulnerability scan (the app shell: Tauri, webview, plugins)"
        run: cargo audit -f app/src-tauri/Cargo.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dependency vulnerability scan (npm)
        working-directory: app
        run: npm audit
