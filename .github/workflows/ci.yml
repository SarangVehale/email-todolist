name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Every action is pinned to a full commit SHA (the comment names the release). Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            engine
            app/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: UI scripts parse
        shell: bash
        run: for f in app/ui/*.js; do node --check "$f"; done
      - name: Versions agree across the project
        shell: bash
        run: python3 scripts/bump_version.py --check
      - name: The release check itself works
        shell: bash
        run: python3 scripts/test_bump_version.py
      - name: Test catalogue is up to date
        shell: bash
        run: |
          python3 scripts/gen_testcases.py
          git diff --exit-code docs/TESTCASES.md || { echo "docs/TESTCASES.md is stale: run python scripts/gen_testcases.py and commit"; exit 1; }
      - name: Format
        working-directory: engine
        run: cargo fmt --check
      - name: Lint (warnings are errors)
        working-directory: engine
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Engine tests (unit, security, edge cases, mock IMAP server, phone hub)
        working-directory: engine
        run: cargo test --locked

  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Dependency vulnerability scan (Rust)
        working-directory: engine
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Dependency vulnerability scan (the app shell: Tauri, webview, plugins)
        run: cargo audit -f app/src-tauri/Cargo.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Dependency vulnerability scan (npm)
        working-directory: app
        run: npm audit
